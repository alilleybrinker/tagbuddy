[package]
name = "tagbuddy"
version = "0.1.0"
edition = "2021"
publish = false


#============================================================================
# Dependencies

#----------------------------------------------------------------------------
# Normal Dependencies

[dependencies.convert_case]
version = "0.6.0"
optional = true

[dependencies.either]
version = "1.8.1"
optional = true

# Mints the unique invariant lifetimes used to brand a `Storage`, so tags can
# only ever be resolved through the storage that interned them.
[dependencies.generativity]
version = "1.2.1"

[dependencies.itertools]
version = "0.11.0"

[dependencies.regex]
version = "1.8.4"
optional = true

# A concurrent, append-only string interner. `ThreadedRodeo` interns and resolves
# through `&self`, so tag storage needs no lock, and it exposes no `&mut` API at
# all -- no `clear`, no `remove` -- which is what makes symbols valid forever.
[dependencies.lasso]
version = "0.7.3"
features = ["multi-threaded", "inline-more"]

[dependencies.typed-builder]
version = "0.14.0"

#----------------------------------------------------------------------------
# Development Dependencies

[dev-dependencies]
anyhow = "1.0.71"


#============================================================================
# Features

[features]
default = ["convert_case", "either", "regex"]
